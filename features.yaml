# FARFALL feature ledger.
#
# A feature is `complete` ONLY when all three hold:
#   1. unit tests cover it and pass through the pre-commit gate
#      (cargo fmt --check, clippy -D warnings, cargo test --workspace);
#   2. it went through the workflow: committed on cockpit-slots, fast-forwarded
#      into m1-planet, release build in ~/space-game;
#   3. end-to-end verification: a bench capture (FARFALL_BENCH / FARFALL_CAPTURE)
#      or a flight was looked at and matched the intent.
# Otherwise: `tests-pass` (1 only), `in-progress`, `planned`, or `deferred`.
# `e2e:` names what was looked at. Keep this file honest; update it per chunk.

rules:
  gpu_only: every visual thing is a WGSL shader (shaders/*.wgsl, composed with common.wgsl; registered in crates/render/src/shaders.rs and validated by crates/render/tests/shader_validation.rs)
  customisable: every applicable feature ships with a setting (menu row + ~/.farfall/settings.cfg key), never asked for
  panels_draggable: every panel (settings, map, readout, holo3PP) is dragged by the cursor/gaze and its anchor saved
  performance: 60 fps floor at 2880x1800; the cabin governs its own detail to hold it (graphics.fps-floor)
  sound: no wind-like noise beds in space, no chimes; the hull's voices are structure-borne
  ledger: complete = tests through the gate + the workflow + an e2e capture or flight looked at (e2e names it)
  deferred_by_owner: crash / ship loss (see id crash)

# Every control the game answers to. All are rebindable on the KEYS page and
# persisted as control.<key>; the menu lists every one (id complete-key-menu).
controls:
  axes: {thrust-forward: W, thrust-back: S, strafe-left: A, strafe-right: D, thrust-up: R, thrust-down: F, pitch-up: Up, pitch-down: Down, yaw-left: Left, yaw-right: Right, roll-left: Q, roll-right: E}
  named: {boost: ShiftLeft, brake: Space, despin: Z, hyper: H, warp-stop: V, map: M, atmosphere: C, engage: J, landing: G, design: K, look-lock: L, trajectory: T, assist: X, chase: Y, holo: N, capture: P, bay: B, next-weapon: U, weapon-1: 1, weapon-2: 2, scale-down: "[", scale-up: "]", hold: O, holo-out: ",", holo-in: ".", disembark: I}
  fixed: {menu: Esc, page: Tab, controls-card: F1, capture-alt: F12, pane-zoom: "+ / -", fire: "left mouse", freelook: "right mouse"}
  rule: every key the game answers to is a Named bind on the KEYS page; only the menu keys, F1, the pane zoom and the mouse buttons are fixed; the HELP page lists every one by group with what it does
  mouse: freelook while the right button is held; left drag turns the map or moves a panel; wheel zooms the map, the bay, or in flight the hologram

# Every key ~/.farfall/settings.cfg may hold, by group (crates/app/src/settings.rs).
settings_keys:
  graphics: [graphics.msaa, graphics.scale, graphics.vsync, graphics.fov, graphics.fps-floor, graphics.sky, graphics.flare, graphics.dust, graphics.bloom, graphics.exposure, graphics.tonemap, graphics.fringe, graphics.nebula, graphics.nebula-seed, graphics.nebula-scale, graphics.nebula-density, graphics.nebula-clouds, graphics.nebula-hue, graphics.nebula-hue2, graphics.nebula-spread, graphics.terrain-detail, graphics.clouds, graphics.city-lights]
  camera: [camera.chase, holo.view, holo.size, cam.shake, cam.drive-shake, holo.range]
  cockpit: [cockpit.frame, cockpit.glow, cockpit.hull, cockpit.res]
  ui: [ui.gauges, ui.gauge-style, ui.guide, ui.shield, ui.hoop-size, ui.landing-hoops, ui.safe-edge, ui.controls-card, "ui.<instrument> (slot, the mini map is ui.map)", "ui.<dial>.size / .style / .fade / .tilt", ui.panel-menu, ui.panel-map, ui.panel-readout, ui.panel-holo]
  rule: every key above has a menu row (crates/app/src/menu.rs::every_settings_key_has_a_menu_row walks settings.rs::KEYS), save the panel anchors, which are set by dragging
  map: [map.rings, map.grid]
  warp: [warp.destination, warp.safe-radii]
  sound: [sound.hull]
  controls: ["control.<axis>", "control.<named>", control.look-sens]
  arms: [arms.power, arms.glow, arms.sight, arms.shards, arms.shard-life, arms.scar-size, arms.scar-cool, arms.ore]
  mimics: [mimics.chance, mimics.hostility, mimics.size]
  miners: [miners.count, miners.growth]
  hold: [hold.gain, hold.face]
  landing: [landing.assist, landing.pad]
  ship: ["ship.hardpoint.<n>", ship.holo-hue, ship.holo-saturation, ship.holo-scanlines, ship.holo-size, ship.holo-spin, ui.panel-bay-card, ui.pointer-size]

# The bench harness (documented in crates/app/src/main.rs). All FARFALL_BENCH_*
# are benchmark-only; the capture is the presented frame.
bench:
  run: "FARFALL_BENCH=1 FARFALL_BENCH_SECONDS=s FARFALL_CAPTURE=final FARFALL_MSAA=1 TMPDIR=dir target/release/farfall"
  perf: "RUST_LOG=info FARFALL_BENCH_FULL=1 FARFALL_VSYNC=off — a 'perf 2880x1800' line every 5 s; pass FARFALL_BENCH_POS (the default spawn logs no perf line and exits at its screenshot); interleave A/B runs, one at a time, no other farfall running"
  reference_scene: "FARFALL_BENCH_POS=16706357148.3,3498039023.8,-24797998372.8 FARFALL_BENCH_LOOK=0.0206,-0.9998,0.0042 (above the ring) — base 11.0 ms, chase 8.5 ms, holo3PP on 11.1 ms (2026-08-25)"
  knobs:
    FARFALL_BENCH_SECONDS: how long a run lasts (20)
    FARFALL_BENCH_FULL: borderless fullscreen at the real resolution
    FARFALL_BENCH_POS / FARFALL_BENCH_VEL / FARFALL_BENCH_LOOK: park the ship at x,y,z with a velocity, looking along a direction
    FARFALL_BENCH_ROLL: rolled about the look axis, radians
    FARFALL_BENCH_ALT: frozen altitude in metres over the planet
    FARFALL_BENCH_HEAD: head yaw,pitch in degrees
    FARFALL_BENCH_SPIN: the head turns a full circle over the run, n times
    FARFALL_BENCH_MAP / _MENU=n / _DESIGN / _LAND / _CARD: the map, the settings menu (paged n times, 0..7), DESIGN mode, LANDING mode, the CONTROLS card up
    FARFALL_BENCH_MAP / _MENU=n / _DESIGN / _LAND: the map, the settings menu (paged n times), DESIGN mode, LANDING mode up
    FARFALL_BENCH_LANDED / _DISEMBARK: parked on the ground, LANDED, on its gear; DISEMBARK pressed at once for its answer on the readout
    FARFALL_BENCH_CHASE / _HOLO: the chase camera, the holo3PP
    FARFALL_BENCH_NEBULA=1|off: a full sky of nebula at twice the stock glow, or off for a baseline
    FARFALL_BENCH_HYPER / _WARP=s / _GHOST=age: the chaos drive's field up; the wormhole drive engaged at s; a WARP STOP after-image this old
    FARFALL_BENCH_STRIKES=n / _G=x,y,z / _THRUST=m,p,y,r: n shield strikes; a felt load in g; forced thrust demands
    FARFALL_SKIP=dust: leave the space dust out, to measure it by its absence (staged moments — GHOST, STRIKES — are aged against the capture, which lands halfway through FARFALL_BENCH_SECONDS)
    FARFALL_BENCH_MIMIC=reveal|hail|attack|wreck: a ship out of a rock ahead-left, mid-reveal, hailing, attacking (fire in the air, a hit on the shell) or a wreck
    FARFALL_BENCH_MINERS=tier[,mine|fight]: a miner of tier 0..3 ahead-left mining a planted rock with its beam, or come about with its fire in the air; a second one far off as a speck
    FARFALL_CAPTURE=final / FARFALL_MSAA / FARFALL_VSYNC / FARFALL_SCALE / FARFALL_MUTE / FARFALL_SKIP=a,b: capture the presented frame; renderer overrides; leave passes out for profiling
  scene_tests: "crates/app/tests/scenes.rs, gated by FARFALL_SCENE_TESTS=1 (the pre-commit gate sets it; FARFALL_NO_SCENES=1 skips) — 11 captures measured"

features:

  - id: web-build
    name: "The game in the browser: the app crate is a library the wasm module and the native binary share; WebGPU; settings in localStorage; async device; web/ page, build.sh and the Pages workflow (the playable link)"
    state: tests-pass
    tests: [crates/render/tests/shader_validation.rs, .github/workflows/ci.yml wasm job]
    e2e: "headless Chrome (chrome-headless-shell 152, Metal) capture of the cockpit at 1280x720 matched native; not yet flown by hand in a browser"
    settings: [graphics.auto-scale]
    notes: "Tint (the browser's WGSL) is stricter than naga: derivatives in branches need diagnostic(off, derivative_uniformity) in common.wgsl; * and ^ need parentheses. AUTO SCALE (on by default in the browser, off native) governs the world's render scale to the FPS floor at full canvas resolution; RENDER SCALE is its ceiling"

  - id: webxr-vr
    name: "VR through the same link (WebXR): the page owns the session and a WebGL2 compositor, the module draws the stereo pair side by side from each eye's seat (cabin eye offset, symmetric frustum wide enough for the headset's, cut back out per eye); controllers drive the keyboard binds"
    state: in-progress
    e2e: "stereo pair verified headless with a synthetic headset (?stereo); not yet worn — needs a Quest (Quest Browser) or Index (SteamVR + Chrome) pass"
    notes: "gauges and HUD sit at the same place in both eyes (infinity); the cabin has parallax. Recentre, per-eye gauge parallax, and controller pointing are follow-ups"
  - id: sim-core
    name: "Deterministic f64 fixed-step sim with golden hash"
    state: complete
    tests: [crates/sim/tests/invariants.rs, crates/sim/tests/aero.rs, crates/sim/tests/contact.rs]
    e2e: "flown since M1"

  - id: planet-render
    name: "Analytic planet with atmosphere, clouds, night lights"
    state: complete
    e2e: "many captures"

  - id: thermal-plasma
    name: "GPU hull heat field and plasma sheath on entry"
    state: complete
    e2e: "entry captures; tear artefact fixed"

  - id: aero-attitude
    name: "Attitude-dependent drag, lift, CoP/CoG torque, aero damping"
    state: complete
    settings: [control.pitch-up, control.pitch-down, control.yaw-left, control.yaw-right, control.roll-left, control.roll-right]
    tests: [crates/sim/tests/aero.rs]
    e2e: "dives reach mach 1 on gravity alone"

  - id: trajectory-hoops
    name: "GPU-integrated predicted path; world-fixed hoops/dashes/dots; hoops astern fade red"
    state: complete
    tests: [crates/render/src/trajectory.rs]
    e2e: "captures fore and aft (FARFALL_BENCH_LOOK)"
    settings: [ui.path, ui.hoops, ui.hoop-sound, ui.hoop-size]

  - id: gauges
    name: "Speed / altitude / G / gyro / horizon+ladder instruments on the canopy"
    state: complete
    settings: [ui.speed, ui.altitude, ui.g-meter, ui.gyro, ui.horizon, ui.ladder, ui.safe-edge]
    e2e: captures

  - id: menu-settings
    name: "In-game menu — GFX / KEYS / CABIN / DIALS / ARMS / MAP / SHIP / HELP tabs, settings grouped by topic (the ship, then every path/hoop setting in one run on CABIN; dials on DIALS; the bay hologram look on SHIP), a flat framed card centred on the screen with the chosen row banded; every row proven to fit; settings file. Superseded in layout by id menu-card"
    state: complete
    settings: [graphics.msaa, graphics.scale, graphics.vsync, graphics.fov, graphics.sky, graphics.flare, ui.panel-menu]
    tests: ["crates/app/src/menu.rs::every_row_of_every_page_fits_the_card", "crates/app/src/menu.rs::the_pages_are_categories_that_make_sense", crates/app/src/settings.rs]
    e2e: "FARFALL_BENCH_MENU=3 capture — DIALS page, rows aligned, card framed"

  - id: relativity
    name: "Light limit above 9,500 m/s; mouldable speed units"
    state: complete
    tests: [crates/sim/tests/relativity.rs]

  - id: bodies
    name: "Moon and Sun rendered at 1:100; finder tags"
    state: complete
    settings: [ui.body-tags]
    e2e: captures

  - id: multi-body-sim
    name: "Moon and Sun pull (tidal, planet frame) and are solid; contact in the body's frame"
    state: complete
    tests: [crates/sim/tests/bodies.rs]
    e2e: "warp to Moon/Sun flown by user"

  - id: occlusion
    name: "Moon and Sun hide the planet"
    state: complete
    tests: [crates/render/src/planet.rs]
    e2e: "captures from behind the Moon (full and partial)"

  - id: freelook
    name: "Head look (right mouse / L); glass re-projected as a sphere about the head"
    state: complete
    settings: [control.look-sens, control.look-lock]
    tests: [crates/app/src/look.rs]
    e2e: "FARFALL_BENCH_HEAD capture"

  - id: gaze-drag-dials
    name: "Left-click while looking drags a dial; free anchors saved"
    state: complete
    tests: [crates/app/src/cockpit.rs, crates/app/src/settings.rs]
    e2e: "user dragged the speed dial (settings file shows `at x,y`)"

  - id: warp-drive
    name: "Wormhole jump with charge / flip / arrive post effects and sound; arrival in a circular orbit of the destination, in the body's own frame (the body's velocity is added, so the Moon and Uranus are arrived at riding along with them). Uranus is arrived at IN THE ASTEROID BELT whatever the safe distance says (the menu shows IN THE BELT): on the ring's middle radius (1.80 R), in the ring's plane, on the side you came from, going round with the rocks at exactly their speed and way — a perfect orbit of the belt, the rocks about you hanging still"
    state: complete
    settings: [warp.destination, warp.safe-radii, control.engage]
    tests: ["crates/app/src/warp.rs::uranus_is_arrived_at_in_the_belt_riding_with_the_rocks", "crates/app/src/warp.rs::every_body_is_arrived_at_in_a_circular_orbit", crates/app/src/warp.rs, crates/audio/src/synth.rs]
    e2e: "FARFALL_BENCH_WARP captures; flown — ENGAGE DRIVE with URANUS set drops you among the rocks at rest relative to them"

  - id: warp-crack
    name: "The warp-barrier crack at the jump (bassier, heavier than the sonic boom)"
    state: tests-pass
    tests: ["crates/audio/src/synth.rs::the_warp_crack_is_a_heavier_deeper_boom"]
    e2e: "not yet heard in flight"

  - id: map-3d
    name: "3D log-radial system map — grid plane, poles, ship dart, orbit camera, BODY RINGS / GRID"
    state: complete
    tests: [crates/app/src/map.rs]
    settings: [map.rings, map.grid]
    e2e: "FARFALL_BENCH_MAP capture"

  - id: warp-mode-pane
    name: "Map as a framed pane with full-screen dim"
    state: complete
    e2e: capture

  - id: landing-mode
    name: "G toggles LANDING — the hoops become HDR-bright gates (radiance 2.2) converging on the predicted touchdown, coloured by the verdict; the prediction is at the gear's height like the sim's contact; a two-line readout that fits the panel: LAND SOFT/FIRM/HARD IN Ns ALT, then VS / ALONG and the cue — FLARE (descent past what the gear takes, ground close), LEVEL (tilted past 15°), GEAR DOWN (last 15 s)"
    state: tests-pass
    tests: ["crates/app/src/landing.rs::every_readout_line_fits_the_panel_in_every_state", "crates/app/src/landing.rs::the_hoops_are_phased_onto_the_touchdown", "crates/app/src/landing.rs::an_orbit_touches_nothing_and_a_hover_is_safe", crates/render/src/trajectory.rs]
    settings: [ui.landing-hoops]
    e2e: "farfall-captures/landing/approach-1.png (FARFALL_BENCH_LAND=1 FARFALL_BENCH_ALT=300)"

  - id: landing-pad
    name: "A landing pad drawn on the ground at the predicted touchdown in LANDING mode (LANDING PAD, landing.pad): a flat ring in the surface's tangent plane with compass ticks, a centre dot and a ring that keeps closing on the centre, in the verdict's colour at radiance 3.0; 60 m across at least, growing with distance so it never shrinks under a degree of sky. A shader quad in the trajectory pass, no assets; the hoops' grid is phased onto it"
    state: tests-pass
    tests: ["crates/render/src/trajectory.rs::uniforms_are_clamped_and_sized", "crates/app/src/landing.rs::the_hoops_are_phased_onto_the_touchdown", crates/render/tests/shader_validation.rs]
    settings: [landing.pad]
    e2e: "farfall-captures/landing/approach-1.png"

  - id: landing-assist
    name: "LANDING ASSIST (landing.assist, default on): in LANDING mode with a touchdown ahead the flight computer holds the hull level over the ground — pitch and roll toward the surface normal, damped (ζ ≈ 0.8 on roll), on any axis the pilot is not using; yaw is the pilot's. App-side control glue like HOLD; the sim is untouched"
    state: tests-pass
    tests: ["crates/app/src/landing.rs::the_assist_levels_the_hull_and_yields_to_the_pilot"]
    settings: [landing.assist]
    e2e: "flight — to be flown; the capture bench is frozen"

  - id: landed-state
    name: "The ship LANDS: set down gently (under 12 m/s) and upright (within 15°), it settles onto its gear at a fixed 2.5 m stance once it slides under 2 m/s, levels, kills its spin, and stays put — velocity locked to the ground's own (the Moon carries it, bit for bit), position recomputed from the body's centre each tick so it cannot drift — until thrust, boost or the hyper field releases it. A hard or tilted touchdown is DOWN, not landed: it skids as before and never settles until it lifts off and re-lands (the crash it should be is deferred, id crash). Sim state (farfall_sim::Ground on ShipState), in the hash; the golden is unchanged because a ship in flight adds nothing. The readout says LANDED ON <BODY> with the touchdown's verdict and speeds (recorded by the app the tick the ground was met), or DOWN ON <BODY> HARD / ROLLING ON <BODY>, mode or no mode"
    state: tests-pass
    tests: ["crates/sim/tests/contact.rs::a_slow_upright_touchdown_settles_and_stays_put_through_a_thousand_ticks", "crates/sim/tests/contact.rs::a_landed_ship_rides_the_ground_exactly_as_the_planet_turns", "crates/sim/tests/contact.rs::throttle_releases_a_landed_ship", "crates/sim/tests/contact.rs::a_hard_or_tilted_touchdown_does_not_settle", "crates/sim/tests/contact.rs::the_ground_state_is_in_the_hash", "crates/sim/tests/invariants.rs::golden_hash", "crates/app/src/landing.rs::a_touchdown_is_judged_from_the_tick_it_happens", "crates/app/src/landing.rs::a_parked_ship_is_landed_level_and_still"]
    e2e: "farfall-captures/landing/landed-1.png (FARFALL_BENCH_LANDED=1)"

  - id: disembark
    name: "DISEMBARK (I, control.disembark): the hook for leaving the ship. Today it answers on the readout — DISEMBARK NOT YET when LANDED, NOT LANDED when down, LAND FIRST in flight — for four seconds; the LANDED readout names the key. The walk-out itself is SPEC §9 M5+"
    state: tests-pass
    tests: ["crates/app/src/input.rs::no_two_default_binds_share_a_key", "crates/app/src/landing.rs::every_readout_line_fits_the_panel_in_every_state", crates/app/src/menu.rs]
    settings: [control.disembark]
    e2e: "farfall-captures/landing/disembark-1.png (FARFALL_BENCH_LANDED=1 FARFALL_BENCH_DISEMBARK=1)"

  - id: ladder-on-nose
    name: "Pitch ladder stays on the boresight under freelook"
    state: complete
    tests: [crates/render/src/attitude.rs]
    e2e: "FARFALL_BENCH_HEAD=25,0 capture with ui.ladder on — bars sit on the nose, left of view"

  - id: uranus
    name: "Uranus as a body and destination (1:100, 19.2 AU, rings); altitude over nearest body. (A uniform-lane bug briefly hid it — the bodies block's field order is now pinned by a test and a scene test)"
    state: complete
    tests: ["crates/sim/tests/bodies.rs::uranus_is_far_large_and_pulls_like_uranus", crates/app/src/map.rs]
    e2e: "FARFALL_BENCH_WARP arrival capture — ice giant overhead, 939 m/s circular orbit, tag ring"

  - id: map-panel-m
    name: "Map as its own UI feature on M with its own DRIVE panel"
    state: complete
    tests: ["crates/app/src/menu.rs::the_drive_panel_sets_the_plan_and_engages_and_never_pages", crates/app/src/map.rs]
    settings: [ui.panel-map]
    e2e: "FARFALL_BENCH_MAP capture — DRIVE panel beside the pane, settings menu has no MAP page"

  - id: panels-gaze-drag
    name: "Settings and map panels gaze-draggable like dials (anchors saved)"
    state: superseded
    superseded_by: "panels-screen-fixed — the panels are cursor-dragged and screen-fixed now; the gaze still takes dials"
    tests: ["crates/app/src/settings.rs::defaults_round_trip", "crates/app/src/map.rs::the_pane_is_a_square_where_the_pilot_put_it"]
    settings: [ui.panel-menu, ui.panel-map]
    e2e: "needs a flight — pick up the panel with the gaze and drop it"

  - id: cockpit-solid
    name: "Solid ray-marched fighter cockpit — fuselage with carved cabin (real wall thickness), nose and swept wings through the glass, arches and rails, metal dash and consoles, sockets with beams under each dial; rendered at a fraction of the scene and composited"
    state: complete
    tests: [crates/render/src/cabin.rs]
