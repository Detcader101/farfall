  - id: miners
    name: "Miners — the ring is worked: MINERS (miners.count, 0..8, 4 stock) ships of our own class are placed from hashes the moment the belt goes live about us (900–2 600 m off, riding the ring, most with little aboard and a few already a tier up), and never again until the ring has been left. Each seeks the nearest rock worth mining (≥ 8 m, within 4 km, not a shroud, not another's claim, and NEVER the rock the pilot is holding station on — taking HOLD on a miner's rock makes it stand off: MINER: YOUR ROCK. WE STAND OFF), flies to a stand-off point off its face matching its velocity, nose on it, and cuts: a hot amber-white beam with a faint red halo from the nose to the rock, ore motes sliding up it toward the ship, a glow where it bites; the haul grows at 0.35 t/s × (1 + tier/2) × MINER GROWTH (miners.growth, 25..400%, 100% stock) by the rock's ore kind, and when the rock has given its share (0.1% of its mass, 2–80 t) it breaks like a shot rock and the miner seeks again. Four tiers by the haul (40 / 160 / 480 t): the hull grows 1.0 → 1.6 → 2.4 → 3.4 × our fighter with the tier's parts unioned on (ore tanks under the wings; a dorsal collector and fatter nacelles; the drill boom), toughness 2.4 → 32 MJ, a shield that sheds 40 % then 65 % of a hit (a cyan sheen over the hull), and guns: longer bursts each tier, the rail at tier 3. Neutral until shot at — a neutral one within 300 m hails once (the relay knock, a line on the readout) — then a tier-0 miner runs and a grown one comes about and fights harder than a mimic; a wreck (dark, tumbling, shards off the break) gives its WHOLE haul to ours × ORE YIELD, plus salvage: WRECK: 200 T HAUL TAKEN. HOLD (O) locks on a miner (HOLD MINER). Far off a miner is a lit speck; the sight marks it with an ivory diamond or edge arrow (kind 3), red and pulsing when hostile (kind 4); Game::contacts() lists mimics and miners as (position, kind) for anything else that marks them. Their slugs, hails and lines ride the mimics' machinery, so the shield, the tracers and the readout needed nothing new"
