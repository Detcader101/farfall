  - id: hud-font-5x7
    name: "A readable HUD font: 5x7 glyphs (slashed 0 against O, serifed 1 against I and l, square 5 against S, flat B against 8) on a 6-pixel advance and a 9-pixel line pitch, the bitmap 384x180 (three vec4<u32> a row); hud.wgsl box-filters the bits over each pixel's footprint so the text is anti-aliased at any scale, with a dark halo under the strokes on the glass so it reads over a white sky; the scale is fractional (h/400, 1.5..8 px a dot) so every block is the same size in canopy units at 800x600 and 2880x1800"
