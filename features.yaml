  - id: mimics
    name: "Mimics — some of the ring's rocks are ships in a holographic shroud shaped like a stone, keyed on the rock's identity (MIMICS, mimics.chance: the share of rocks, 0..100%, 100% stock at the user's ask so every rock is a ship until turned down; fragments never). A slug on one is the reveal: the ship glows through the stone as a cyan hologram (bands running its length, a scan plane, a projector's flicker), the rock winks off (taken out of the belt for good, so it never comes back from the hash), the hologram hardens into a sun-lit hull over 2.6 s; a thrum through the frame; CONTACT on the readout. Then by its mood (HOSTILITY, mimics.hostility: the share that shoot, 50% stock): a HAILER comes about to face us, matches velocity at a courteous range, and talks — one of six lines on the readout, a white beacon pulsing at its nose, the relay knocking in twice — then burns away; a HOSTILE (darker hull, a rust belly stripe, amber engines) comes about, holds ~500 m weaving, leads us and fires its cannon in bursts (red tracers) — hits ring the shield, kick the helmet camera and cost HULL (35 % a slug on the readout: HULL 65%  UNDER FIRE; no ship loss, crash is deferred). Ours land on it too: bursts on the hull, scorch spreading with the wound, past 2.4 MJ it is a WRECK — dark, tumbling, embers guttering in the damage, shards off the break, salvage into the HAUL — and a hostile hurt past half breaks off and runs; a hailer shot at goes hostile or runs. Up to four in the air; mimic.wgsl draws them from the shared fighter SDF at their own poses, hidden behind nearer rocks; their tracers ride the tracer pass. Polish (2026-08-31, the owner's 'make mimic ships as big as me'): a mimic IS our fighter's SDF at 1:1 — it read small only because of range — so the pass carries a size lane per hull (MimicView.size, the hit sphere scaling with it) and the encounter comes in close enough to see: a hailer comes alongside at 90 m, a hostile holds 320 m (its spread widened a touch). The