    name: "The frame's plumbing: bake.wgsl bakes the noise/star maps once at start; the world renders at graphics.scale into an HDR (Rgba16Float) target, post.wgsl blooms, exposes and tonemaps it (id hdr-post) and does the drive's distortion to it, the cabin and dials draw over that into an 8-bit target, blit.wgsl upscales it and the HUD draws native on top; cabin_blit.wgsl composites the cached cabin march (id cabin-cached) over the sky. FARFALL_SKIP=a,b leaves passes out for profiling; FARFALL_SCALE overrides the scale; [ and ] step it in flight (RENDER SCALE +/- binds)"
    state: complete
    settings: [graphics.scale, graphics.msaa, graphics.vsync, control.scale-down, control.scale-up]
    tests: ["crates/render/tests/shader_validation.rs", "crates/app/src/settings.rs::edits_round_trip", "crates/app/src/input.rs::no_two_default_binds_share_a_key"]
    e2e: "every capture goes through it; perf lines name the scale"

  - id: perf-staging
    name: "The staging perf pass (everything merged): per-pass budget at the reference scene, 2880x1800 uncapped, medians of interleaved runs — base 11.5 ms; starfield ~3.5, bodies (Uranus + ring) ~3, gauges+horizon+sight ~3, planet ~1.3, cabin (cached) ~0.2; chase 8.9; holo3PP 13.0; the SHIP bay 24.4 -> 18.1 (a box bound on the march instead of a sphere, mounts gated behind the hull's distance, 4-tap normals, 56 steps); dials draw only in their own scissor patch (draw_within) and hidden dials are not drawn at all; belt specks search only the neighbour cells a rock could reach from. Next: the starfield's per-pixel cost, the ring's shading, the bay at half resolution"
    state: in-progress
    tests: ["crates/app/src/main.rs::a_dial_draws_only_in_its_own_patch", "crates/render/tests/shader_validation.rs"]
    e2e: "bench.sh runs above; dials capture unchanged with the scissors"

  - id: a10-warthog-style
    name: "The A-10 Warthog cockpit, chunk 1 — the WARTHOG gauge style (ui.gauge-style = warthog, or per dial ui.<dial>.style): every dial a steam gauge set into the dash in the DIAL housing — black face, white markings and needle, the warning arc red-orange, a machined bezel ring — the accelerometer cross-plot in the same white, and the attitude ball a real ADI, brighter blue over brown. Selectable cockpit-wide on the GAUGES page or per dial through the existing size/style/fade/tilt customisation; TRON, JET and DIAL untouched. FARFALL_BENCH_STYLE=k sets the cockpit's style for a capture. Next chunks: the A-10 dash layout with more instruments (vertical speed, AoA from the aero model's alpha, engine RPM/temperature from effort and strain, heading), the warning-light panel, side-console legends"
    state: complete
    settings: [ui.gauge-style, "ui.<dial>.style"]
    tests: ["crates/render/src/gauge.rs::jet_style_rides_on_the_warning_sense", "crates/app/src/settings.rs::dials_stay_lit_by_default_and_every_style_is_open_to_every_dial", "crates/render/tests/shader_validation.rs", "crates/app/tests/scenes.rs::the_warthog_dials_are_white_steam_gauges_in_the_dash"]
    e2e: "FARFALL_BENCH_STYLE=warthog capture — three white-on-black steam gauges with bezels set into the dash, the ADI ball blue over brown (scene test)"
    note: "2026-08-31 polish: WARTHOG is now the cockpit default (settings.rs); the faces sit on the dash in machined bezels, no housing well; the gyro is the real ball"


  - id: gauges-on-the-dash
    name: "Polish pass, gauges (fable/gauges, 2026-08-31) — WARTHOG is the default gauge style; NO CAVITIES: the cabin marcher no longer hollows anything for an instrument (no TRON recess or lit socket, no JET bowl, no DIAL well) — a DIAL/WARTHOG face is a black plate 8 mm proud of the dash's real surface (the slab's 4 cm rounding, DASH_SURFACE) inside a thin machined bezel, the JET/WARTHOG gyro a real sphere standing out of the metal with a seam ring and painted only above the surface, JET dials over a thin flush ring, TRON over bare metal with its beam; the seam light lines no longer paint the plates. Quality: every stroke on gauge/gvec/gyro is a constant-width line with one pixel of AA (ticks are arc-length strokes at true multiples of the scale — 0 and full scale included, so a major sits under every mach bar), halo light separated from structure and switched off on the dash (printed markings, no glow), a tapered steam-gauge pointer with a boss, the warning arc painted red on the scale (top for speed/G, bottom for altitude) instead of tinting the whole dial, the ×m Ek multiplier printed on the face under the hub (arc gauge) and the G-vector drawn at 0.82 on the dash so its bar sits on the plate, heavier readout digits, the ball's wings with a dark border, hologram accents at radiance > 1. Pitch ladder: 9° bars, 30°/60° heavier, end ticks, the pitch in degrees at both ends (7-seg), azimuth conformal (cos elev), camera-space handedness fixed so numerals read the right way round, drawn BEFORE the cabin so the dash occludes it. Landing hoops: crisp one-pixel-plus core at 1.8 radiance with a soft skirt"
    state: complete
    tests: ["crates/render/src/cabin.rs::the_ball_stands_proud_of_the_dash_with_no_bowl", "crates/render/src/cabin.rs::the_head_turns_the_rays_not_the_cabin", "crates/app/src/settings.rs::warthog_is_the_default_and_the_menu_still_cycles_every_style", "crates/render/tests/shader_validation.rs", "crates/render/src/gauge.rs::jet_style_rides_on_the_warning_sense"]
    settings: [ui.gauge-style, "ui.<dial>.style"]
    e2e: "farfall-captures/gauges: r3-default (WARTHOG cluster on the dash, no cavities), r3-head (FARFALL_BENCH_HEAD=30,-15 — plates and ball seen at an angle, nothing hollow), r3-tron / r3-jet / r3-dial, r3-g (FARFALL_BENCH_G=1,0.5,2), r3-landing (hoops + ladder), r3-spin-1..4, r3-full perf"

  - id: hdr-post
    name: "HDR picture (polish pass, fable/postfx): the world renders into a float Rgba16Float target (MSAA as before) and every world pass writes exposed linear radiance (common.wgsl radiance()) instead of curving itself; post.wgsl then does it once — a bloom mip chain (13-tap down / 9-tap tent up, threshold with a soft knee in radiance, partial Karis so a lone star seeds a halo not a firefly; the chain starts at half the scene so its cost follows the render scale governor), exposure (EXPOSURE, ±2 stops in quarter steps, with a slow built-in drift off the frame's mean log luminance riding in the chain's alpha: a starry sky lifted a third of a stop at most, a sunlit planet held back half), a filmic curve (TONEMAP: AGX — highlights roll to white through their hue — / SOFT / OFF), a hair of chromatic fringing at the glass rim only (FRINGE) and a hash dither to 8 bits. The cabin, dials, holo3PP, map, bay and text draw AFTER it into the 8-bit ship target / the swapchain, so none of them bloom, curve or fringe. FARFALL_SKIP=post|bloom for the cost"
    state: complete
    settings: [graphics.bloom, graphics.exposure, graphics.tonemap, graphics.fringe]
    tests: ["crates/render/src/post.rs::the_bloom_chain_halves_until_a_level_would_be_too_small", "crates/render/src/post.rs::the_look_is_clamped_and_never_nan", "crates/render/src/post.rs::tonemap_keys_round_trip_and_cycle", "crates/app/src/settings.rs::edits_round_trip", "crates/app/src/menu.rs::the_pages_are_categories_that_make_sense", crates/render/tests/shader_validation.rs]
    e2e: "farfall-captures/postfx: cockpit, arms, hyper, nebula, alt500, chase, full — the Sun, tracers, plumes and the drive field bloom; the dials do not (see docs/polish/postfx.md)"

  - id: drive-outside-the-glass
    name: "The drives' picture — the wormhole's mirror-sphere FLIP and inversion, the chaos field's liquid refraction and ripples, the speed streaks and their chromatic split, the cool rim — moved from the swapchain blit to the post pass, so it is done to the WORLD before the cabin, the dials, the holo3PP and the text are drawn: the drive is seen through the glass, the dash and the gauges hold still and crisp through the whole sequence (Jay Jay: 'shaders not on POV but outside the ship')"
    state: complete
    tests: [crates/render/tests/shader_validation.rs, "crates/app/src/warp.rs::the_sequence_jumps_exactly_once_at_the_flips_peak"]
    e2e: "farfall-captures/postfx/hyper-*.png — the streaks and the field stop at the sill; the dials read (baseline/hyper-1.png smeared them)"

  - id: stars-fine
    name: "The starfield as points: sub-pixel gaussian cores (sigma ~0.6 px) instead of the old 3-px blobs, a steeper magnitude law (most stars faint, a few brilliant, the rare one blazing) so only the bright ones bloom, the tint by temperature strongest on the bright ones where the eye actually sees colour, and the nebula carrying the sky behind them"
