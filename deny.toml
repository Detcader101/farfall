# License policy (SPEC §10): permissive only. Anything not on this list fails
# CI — including every flavor of GPL/LGPL/AGPL, which must never enter the tree.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    # MPL-2.0 is file-level copyleft on the dependency's own files only; it does
    # not propagate to our code. Allowed for transitive deps, with eyes open.
    "MPL-2.0",
]
