[workspace]
resolver = "2"
members = ["crates/sim", "crates/render", "crates/audio", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/farfall"

[workspace.dependencies]
glam = { version = "0.33", features = ["bytemuck"] }
libm = "0.2"
wgpu = "30.0"
winit = "0.30.8"
bytemuck = { version = "1.22", features = ["derive"] }
pollster = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
log = "0.4"
naga = { version = "30.0", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
