[package]
name = "farfall-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native shell: window, input, frame loop, sim<->render wiring."

[[bin]]
name = "farfall"
path = "src/main.rs"

[dependencies]
farfall-sim = { path = "../sim" }
farfall-render = { path = "../render" }
farfall-audio = { path = "../audio" }
wgpu = { workspace = true }
winit = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
png = "0.17"
web-time = "1.1"

[lib]
crate-type = ["cdylib", "rlib"]

# The stick on Windows: winmm's joyGetPosEx through the windows-sys crate
# winit already brings in (MIT OR Apache-2.0) — no new dependency tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Multimedia"] }

# Native VR (SPEC §5.3): the OpenXR session and the raw Vulkan handshake that
# hands wgpu-hal a device born from the runtime instead of a bare adapter
# pick. `openxr`'s "loaded" default dynamically loads the runtime's loader
# (SteamVR's, at runtime, never linked) — no `static` feature, ever. `ash`
# is pinned to the same major version wgpu-hal's own (private) dependency
# uses, since the two must agree bit-for-bit on `ash::Instance`/`ash::Device`
# for `wgpu_hal::vulkan::Instance::from_raw`/`device_from_raw` to accept them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openxr = "0.21"
ash = "0.38"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Storage", "CssStyleDeclaration", "Navigator", "Gamepad", "GamepadButton", "Event", "EventTarget", "VisibilityState"] }
